name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 放在 job 级别：buildPlugin 首次启动 Gradle daemon 时就带上 token，
      # 后续 publishPlugin 复用同一 daemon 才能通过 System.getenv 取到。
      JETBRAINS_PLUGIN_TOKEN: ${{ secrets.JETBRAINS_PLUGIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove local-only Gradle JDK path (CI relies on JAVA_HOME)
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check token secret is set
        run: |
          if [ -z "$JETBRAINS_PLUGIN_TOKEN" ]; then
            echo "::error::Secret JETBRAINS_PLUGIN_TOKEN 为空或未配置"
            exit 1
          fi
          echo "token length: ${#JETBRAINS_PLUGIN_TOKEN}"

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.ver.outputs.version }}

      - name: Create GitHub Release with zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/thief-book-idea-*.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.ver.outputs.version }}