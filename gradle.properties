# Gradle 守护进程使用的 JVM（IntelliJ Platform 2023.x 需要 JDK 17）
# 如本机 JDK 17 路径不同，请修改为你的 JDK 17 安装路径
org.gradle.java.home=D:/soft/pkg/jdk/jdk-17.0.12
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 构建所用 IntelliJ Platform 版本（社区版，用于编译与 runIde 沙箱）
# 最低兼容版本由 plugin.xml 中 since-build="203.0" 决定
intellijVersion=2023.3
